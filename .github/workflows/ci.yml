name: CI Build & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Ensure docker compose is available
        run: docker compose version

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build app image with Buildx and cache
        run: |
          docker buildx create --use --name buildx-builder || true
          docker buildx build --cache-from=type=gha --cache-to=type=gha,mode=max -t pipeline-app:ci . --load

      - name: Start services
        run: docker compose up -d

      - name: Wait for DB to be ready
        run: |
          set -e
          for i in {1..30}; do
            if docker compose exec db pg_isready -U postgres >/dev/null 2>&1; then
              echo "db ready"
              break
            fi
            echo "waiting for db... ($i)"
            sleep 2
          done

      - name: Run database migrations
        run: |
          # run migrations if any (no-op if none)
          docker compose exec app npx prisma migrate deploy || true
          docker compose exec app npm run prisma:generate || true

      - name: Wait for app to be ready
        run: |
          set -e
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/ >/dev/null 2>&1; then
              echo "app ready"
              break
            fi
            echo "waiting for app... ($i)"
            sleep 2
          done

      - name: Collect runtime artifacts
        run: |
          mkdir -p artifacts
          docker compose ps > artifacts/docker_compose_ps.txt || true
          docker compose logs --tail=200 app > artifacts/app_logs.txt || true
          docker images --no-trunc > artifacts/images.txt || true
          cp -v beacon/*.png artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
