name: CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
      # Automatically enable Docker services when running on github.com (real Actions).
      # Keep disabled by default for local Act runs to avoid requiring docker socket.
      RUN_DOCKER_SERVICES: ${{ github.server_url == 'https://github.com' && 'true' || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Construct or override DATABASE_URL from POSTGRES_* secrets
        run: |
          # If POSTGRES_* secrets are provided, use them to build the URL and
          # override any existing DATABASE_URL so the app inside docker-compose
          # can resolve the DB host as the Compose service name `db`.
          if [ -n "${POSTGRES_USER:-}" ] && [ -n "${POSTGRES_PASSWORD:-}" ] && [ -n "${POSTGRES_DB:-}" ]; then
            echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}" >> $GITHUB_ENV
            echo "Constructed DATABASE_URL from POSTGRES_* secrets (overriding provided DATABASE_URL if any)"
          else
            if [ -n "${DATABASE_URL:-}" ]; then
              echo "Using provided DATABASE_URL secret"
            else
              echo "ERROR: No DATABASE_URL and no complete POSTGRES_* secrets available" >&2
              exit 1
            fi
          fi
      - name: Check DATABASE_URL present and valid
        if: ${{ env.RUN_DOCKER_SERVICES == 'true' || env.DATABASE_URL != '' }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: DATABASE_URL is not set in runner environment. Add it as a repository secret (Settings → Secrets → Actions)." >&2
            exit 1
          fi
          case "${DATABASE_URL}" in
            postgresql://*|postgres://*) echo "DATABASE_URL format OK" ;;
            *) echo "ERROR: DATABASE_URL must start with 'postgresql://' or 'postgres://'" >&2 ; exit 1 ;;
          esac
      - name: Run smoke tests
        run: |
          echo "Running smoke tests (non-invasive)"
          node ./scripts/test/smoke.js
        shell: bash
      - name: Build containers
        if: ${{ env.RUN_DOCKER_SERVICES == 'true' }}
        run: docker compose build
      - name: Prepare secret files for docker-compose
        if: ${{ env.RUN_DOCKER_SERVICES == 'true' }}
        run: |
          echo "Preparing ./secrets files for docker-compose"
          mkdir -p ./secrets
          # Write DATABASE_URL (if present) to secrets file used by compose
          if [ -n "${DATABASE_URL:-}" ]; then
            echo -n "${DATABASE_URL}" > ./secrets/database_url.txt
            echo "Wrote database_url.txt"
          fi
          # Write individual postgres secrets if present
          if [ -n "${POSTGRES_USER:-}" ]; then
            echo -n "${POSTGRES_USER}" > ./secrets/postgres_user.txt
          fi
          if [ -n "${POSTGRES_PASSWORD:-}" ]; then
            echo -n "${POSTGRES_PASSWORD}" > ./secrets/postgres_password.txt
          fi
          if [ -n "${POSTGRES_DB:-}" ]; then
            echo -n "${POSTGRES_DB}" > ./secrets/postgres_db.txt
          fi
          if [ -n "${NEXTAUTH_SECRET:-}" ]; then
            echo -n "${NEXTAUTH_SECRET}" > ./secrets/nextauth_secret.txt
          fi
          ls -la ./secrets || true
      - name: Start services
        if: ${{ env.RUN_DOCKER_SERVICES == 'true' }}
        run: docker compose up -d
      - name: Wait for database readiness
        if: ${{ env.RUN_DOCKER_SERVICES == 'true' }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "No DATABASE_URL available for readiness check; skipping readiness probe.";
            exit 0;
          fi
          echo "Waiting for database to accept connections via psql (up to 2 minutes)..."
          success=0
          for i in $(seq 1 60); do
            docker run --rm -e DATABASE_URL="${DATABASE_URL}" postgres:15 sh -c 'psql "$DATABASE_URL" -c "SELECT 1;"' >/dev/null 2>&1 && { success=1; echo "DB ready (attempt $i)"; break; }
            echo "Attempt $i: DB not ready yet; sleeping 2s"
            sleep 2
          done
          if [ "$success" -ne 1 ]; then
            echo "Timed out waiting for database to become ready" >&2
            exit 1
          fi
      - name: Apply migrations (full smoke)
        if: ${{ env.RUN_DOCKER_SERVICES == 'true' }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: DATABASE_URL is not set" >&2
            exit 1
          fi
          echo "Running full smoke: node ./scripts/test/smoke.js --full"
          node ./scripts/test/smoke.js --full
      - name: Tear down
        if: ${{ always() && env.RUN_DOCKER_SERVICES == 'true' }}
        run: docker compose down -v

  # deploy job removed: on-prem/EC2 SSH deployment was removed from this
  # workflow to simplify local development and avoid accidental SSH steps
  # during CI runs. If you need a deploy step in future, see README.md
  # for a suggested implementation snippet.

