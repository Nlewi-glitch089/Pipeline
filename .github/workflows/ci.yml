name: CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build containers
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for database
        run: sleep 15
      - name: Generate Prisma client
        run: docker compose exec -T app npm run prisma:generate
      - name: Run migrations
        run: docker compose exec -T app npx prisma migrate deploy
      - name: Build app
        run: docker compose exec -T app npm run build
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -d ~/my-app ]; then
              git clone https://github.com/YOUR-USERNAME/YOUR-REPO.git ~/my-app
            fi
            cd ~/my-app && git pull origin main
            docker compose down
            docker compose up --build -d
            docker compose exec app npx prisma migrate deploy
name: CI Build & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Ensure docker compose is available
        run: docker compose version

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build app image with Buildx and cache
        run: |
          docker buildx create --use --name buildx-builder || true
          docker buildx build --cache-from=type=gha --cache-to=type=gha,mode=max -t pipeline-app:ci . --load

      - name: Start services
        run: docker compose up -d

      - name: Wait for DB to be ready
        run: |
          set -e
          for i in {1..30}; do
            if docker compose exec db pg_isready -U postgres >/dev/null 2>&1; then
              echo "db ready"
              break
            fi
            echo "waiting for db... ($i)"
            sleep 2
          done

      - name: Run database migrations
        run: |
          # run migrations if any (no-op if none)
          docker compose exec app npx prisma migrate deploy || true
          docker compose exec app npm run prisma:generate || true

      - name: Wait for app to be ready
        run: |
          set -e
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/ >/dev/null 2>&1; then
              echo "app ready"
              break
            fi
            echo "waiting for app... ($i)"
            sleep 2
          done

      - name: Collect runtime artifacts
        run: |
          mkdir -p artifacts
          docker compose ps > artifacts/docker_compose_ps.txt || true
          docker compose logs --tail=200 app > artifacts/app_logs.txt || true
          docker images --no-trunc > artifacts/images.txt || true
          cp -v beacon/*.png artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
