version: '2.4'
services:
  database:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    # Use Docker secrets for DB credentials; an init command reads secrets
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    command: ["sh","-c","export POSTGRES_USER=$(cat /run/secrets/postgres_user) && export POSTGRES_PASSWORD=$(cat /run/secrets/postgres_password) && export POSTGRES_DB=$(cat /run/secrets/postgres_db) && docker-entrypoint.sh postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user) -d $(cat /run/secrets/postgres_db) -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    secrets:
      - database_url

volumes:
  db-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
  database_url:
    file: ./secrets/database_url.txt
